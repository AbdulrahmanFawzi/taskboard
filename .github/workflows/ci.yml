# Test every push. On master: build images, deploy to staging, then wait for a person to
# approve production (set "Required reviewers" on the production environment in GitHub).
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - name: Backend tests
        run: dotnet test --configuration Release
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Frontend type-check and build
        working-directory: frontend
        run: npm ci && npm run build

  images:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        # Image names must be lowercase; the account name (AbdulrahmanFawzi) is not.
        run: |
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.tag.outputs.registry }}/taskboard-api:${{ steps.tag.outputs.tag }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.tag.outputs.registry }}/taskboard-web:${{ steps.tag.outputs.tag }}

  # Deploys stay off until the servers exist: set the repository variable DEPLOY_ENABLED=true
  # (Settings → Secrets and variables → Actions → Variables) once the secrets below are in place.
  deploy-staging:
    needs: images
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: cd ~/taskboard/deploy && git pull --ff-only && ./deploy.sh staging ${{ needs.images.outputs.tag }}
      - name: Smoke test staging
        run: |
          curl -fsS --retry 10 --retry-delay 3 "https://${{ vars.STAGING_DOMAIN }}/health"
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://${{ vars.STAGING_DOMAIN }}/api/workspaces")
          test "$code" = 401 || { echo "expected 401 without a session, got $code"; exit 1; }

  deploy-production:
    needs: [images, deploy-staging]
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: cd ~/taskboard/deploy && git pull --ff-only && ./deploy.sh production ${{ needs.images.outputs.tag }}
      - name: Smoke test production
        run: curl -fsS --retry 10 --retry-delay 3 "https://${{ vars.PRODUCTION_DOMAIN }}/health"
