# One file for both environments. Each server (or each project name on one server) gets its own
# .env file; see deploy/.env.example and DEPLOY.md.
#
#   docker compose -p taskboard-staging    --env-file .env.staging    up -d
#   docker compose -p taskboard-production --env-file .env.production up -d
name: taskboard

services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskboard
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskboard -d taskboard"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    image: ${REGISTRY:-ghcr.io/your-org}/taskboard-api:${TAG:-latest}
    build: { context: ../backend }
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      ASPNETCORE_ENVIRONMENT: ${APP_ENV:-Production}
      ConnectionStrings__Default: Host=db;Port=5432;Database=taskboard;Username=taskboard;Password=${POSTGRES_PASSWORD}
      Security__RequireTwoFactor: "true"
      Security__AuthenticatorIssuer: ${AUTHENTICATOR_ISSUER:-TaskBoard}
      Security__SecureCookies: ${SECURE_COOKIES:-true}
    networks: [internal]

  web:
    image: ${REGISTRY:-ghcr.io/your-org}/taskboard-web:${TAG:-latest}
    build: { context: ../frontend }
    restart: unless-stopped
    depends_on: [api]
    networks: [internal]

  # Public entry point: gets and renews the HTTPS certificate for DOMAIN automatically.
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: [web]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in the env file}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    networks: [internal]

volumes:
  dbdata:
  caddydata:
  caddyconfig:

networks:
  internal:
