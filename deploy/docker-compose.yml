# One file for both environments. Each server (or each project name on one server) gets its own
# .env file; see deploy/.env.example and DEPLOY.md.
#
#   docker compose -p taskboard-staging    --env-file .env.staging    up -d
#   docker compose -p taskboard-production --env-file .env.production up -d
name: taskboard

services:
  # Only for a rehearsal on a machine without Oracle (start with --profile bundled-db).
  # Staging and production connect to the organisation's Oracle 19c through ORACLE_CONNECTION.
  oracle:
    image: gvenzl/oracle-free:23-slim
    profiles: [bundled-db]
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${BUNDLED_ORACLE_SYS_PASSWORD:-change-me}
      APP_USER: taskboard
      APP_USER_PASSWORD: ${BUNDLED_ORACLE_APP_PASSWORD:-change-me}
    volumes:
      - oradata:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [internal]

  api:
    image: ${REGISTRY:-ghcr.io/your-org}/taskboard-api:${TAG:-latest}
    build: { context: ../backend }
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${APP_ENV:-Production}
      ConnectionStrings__Default: ${ORACLE_CONNECTION:?set ORACLE_CONNECTION in the env file}
      Database__Provider: Oracle
      Database__OracleSqlCompatibility: "19"
      Database__ApplyMigrations: ${DB_APPLY_MIGRATIONS:-true}
      Security__RequireTwoFactor: "true"
      Security__AuthenticatorIssuer: ${AUTHENTICATOR_ISSUER:-TaskBoard}
      Security__SecureCookies: ${SECURE_COOKIES:-true}
    networks: [internal]

  web:
    image: ${REGISTRY:-ghcr.io/your-org}/taskboard-web:${TAG:-latest}
    build: { context: ../frontend }
    restart: unless-stopped
    depends_on: [api]
    networks: [internal]

  # Public entry point: gets and renews the HTTPS certificate for DOMAIN automatically.
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: [web]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in the env file}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    networks: [internal]

volumes:
  oradata:
  caddydata:
  caddyconfig:

networks:
  internal:
