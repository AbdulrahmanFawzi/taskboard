# Local development only: a Postgres for `dotnet run`. Staging and production use deploy/.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: taskboard
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: taskboard-dev
    ports: ["127.0.0.1:5432:5432"]
    volumes: [devdata:/var/lib/postgresql/data]
volumes:
  devdata:
